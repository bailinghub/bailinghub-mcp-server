name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@latest
      - run: npm ci
      - run: npm run check:release-tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: npm run verify

      - name: Check whether this npm version already exists
        id: npm-version
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/wait-npm-publication.mjs --before-publish >> "$GITHUB_OUTPUT"

      - name: Publish npm package with trusted publishing
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish --access public

      - name: Wait for exact npm publication and verify source identity
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/wait-npm-publication.mjs

      - name: Install MCP Registry publisher
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP server metadata
        run: ./mcp-publisher publish
